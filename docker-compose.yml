services:
  postgres:
    image: postgres:16-alpine
    container_name: shopygenie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopygenie
      POSTGRES_PASSWORD: shopygenie
      POSTGRES_DB: shopygenie
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopygenie -d shopygenie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
